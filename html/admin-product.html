<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Úprava produktu | ICZZ</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; color: #222; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input, textarea, select { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
    textarea { min-height: 180px; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <p><a id="back-link" href="/">← Zpět na obchod</a></p>
  <h1>Upravit produkt</h1>
  <label for="product-select">Produkt</label>
  <select id="product-select">
    <option value="product1">A GREAT CHAOS CHAIN - REPLICA</option>
    <option value="product2">RICK OWENS SS20 BRUTALIST CHAIN</option>
    <option value="product3">RICK OWENS DRKSHDW</option>
    <option value="product4">MAISON MARGIELA FUTURE</option>
    <option value="product5">YZY WET TANK TOP</option>
    <option value="product6">XO PENDANT - THE WEEKND REPLICA</option>
    <option value="product7">GRADUATION - ACTION FIGURE</option>
    <option value="product8">GRADUATION CD</option>
    <option value="product9">BULLY CD</option>
    <option value="product10">MICHAEL JACKSON - THRILLER CD</option>
  </select>
  <p>ID v databázi: <strong id="product-id">načítám…</strong></p>
  <form id="product-form">
    <label for="name">Název</label>
    <input id="name" name="name" required>
    <label for="description">Popis</label>
    <textarea id="description" name="description" required></textarea>
    <label for="price">Cena (€)</label>
    <input id="price" name="price" type="number" min="0" step="0.01" required>
    <label for="imagePath">Cesta k obrázku</label>
    <input id="imagePath" name="imagePath" required>
    <button type="submit">Uložit změny do databáze</button>
  </form>
  <p id="status" role="status"></p>
  <script src="/javascript/admin-product.js?v=all-products-2" defer></script>
</body>
</html>
