<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 176" role="img" aria-labelledby="title desc">
  <title id="title">ICZZ silver alphabet</title>
  <desc id="desc">The full A to Z alphabet in a sharp metal style with bright silver diamond inspired highlights based on the ICZZ logo.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".18" stop-color="#b8bdc4"/>
      <stop offset=".34" stop-color="#fff"/>
      <stop offset=".55" stop-color="#767d86"/>
      <stop offset=".72" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#a3a9b1"/>
    </linearGradient>
    <filter id="edge" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feOffset dy="1.4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
<g id="sparkles">
      <path d="M10 16l1.4 3.8 3.8 1.4-3.8 1.4L10 26l-1.4-3.8-3.8-1.4 3.8-1.4zM51 37l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#fff"/>
      <circle cx="21" cy="11" r=".85" fill="#fff" opacity=".9"/><circle cx="46" cy="17" r=".65" fill="#fff" opacity=".85"/>
    </g>
  </defs>
